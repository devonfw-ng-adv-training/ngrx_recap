<section class="users-panel">
  <div class="users-header">
    <div>
      <p class="eyebrow">NgRx Effects</p>
      <h2>Users</h2>
    </div>
    <button type="button" (click)="loadUsers()" [disabled]="(viewModel$ | async)?.loading">
      Reload
    </button>
  </div>

  <ng-container *ngIf="viewModel$ | async as viewModel">
    <p *ngIf="viewModel.loading" class="status">Loading users...</p>
    <p *ngIf="viewModel.error" class="status error">{{ viewModel.error }}</p>

    <ul class="user-list">
      <li *ngFor="let user of viewModel.users">
      <strong>{{ user.name }}</strong>
      <span>{{ user.email }}</span>
      </li>
    </ul>

    <p *ngIf="viewModel.users.length === 0 && !viewModel.loading && !viewModel.error" class="status">
      No users found.
    </p>
  </ng-container>
</section>
